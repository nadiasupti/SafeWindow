# Flood-extent references for the Aug-Sep 2025 Trimmu flood: Copernicus EMS
# Rapid Mapping EMSR838, AOI 05 (Trimmu), delineation products. Used by
# scripts/benchmark_region.py. None was used to build or tune SafeWindow.
#
# EMS "observedEventA" holds the flooded area (normal water bodies are mapped
# separately and are not in it), comparable to SafeWindow's change rule.
# Parts of an image EMS could not analyse are listed in imageFootprintA as
# "Not Analysed - No data" and are left out of the comparison.

event_code: EMSR838
publisher: "Copernicus Emergency Management Service (European Commission)"
license: "Copernicus EMS products, free and open with attribution"
shapefile_dir: ../data/sources/emsr838_aoi05        # relative to this file; each reference names its product folder
archives:
  - {url: "https://rapidmapping.emergency.copernicus.eu/backend/EMSR838/AOI05/DEL_PRODUCT/EMSR838_AOI05_DEL_PRODUCT_v1.zip"}
  - {url: "https://rapidmapping.emergency.copernicus.eu/backend/EMSR838/AOI05/DEL_MONIT01/EMSR838_AOI05_DEL_MONIT01_v1.zip"}
  - {url: "https://rapidmapping.emergency.copernicus.eu/backend/EMSR838/AOI05/DEL_MONIT02/EMSR838_AOI05_DEL_MONIT02_v1.zip"}
  - {url: "https://rapidmapping.emergency.copernicus.eu/backend/EMSR838/AOI05/DEL_MONIT03/EMSR838_AOI05_DEL_MONIT03_v1.zip"}
  - {url: "https://rapidmapping.emergency.copernicus.eu/backend/EMSR838/AOI05/DEL_MONIT04/EMSR838_AOI05_DEL_MONIT04_v1.zip"}

tiers:
  radar: "different radar satellite (ICEYE X-band), within 1-3 days"
  same_sensor: "same Sentinel-1 image, Copernicus EMS method; tests the method, not the data"

references:
  - id: ems_iceye_20250830
    tier: radar
    sensor: "ICEYE (X-band SAR), 30 Aug 2025 23:54 UTC"
    date: "2025-08-30"
    dir: DEL_MONIT01
    flood: EMSR838_AOI05_DEL_MONIT01_observedEventA_v1
    analysis: EMSR838_AOI05_DEL_MONIT01_areaOfInterestA_v1
    exclude: EMSR838_AOI05_DEL_MONIT01_imageFootprintA_v1
    exclude_where: {obj_type: "Not Analysed - No data"}
    predictions: ["2025-09-01", "2025-08-28"]

  - id: ems_iceye_20250831
    tier: radar
    sensor: "ICEYE (X-band SAR), 31 Aug 2025 17:28 UTC"
    date: "2025-08-31"
    dir: DEL_MONIT02
    flood: EMSR838_AOI05_DEL_MONIT02_observedEventA_v1
    analysis: EMSR838_AOI05_DEL_MONIT02_areaOfInterestA_v1
    exclude: EMSR838_AOI05_DEL_MONIT02_imageFootprintA_v1
    exclude_where: {obj_type: "Not Analysed - No data"}
    predictions: ["2025-09-01", "2025-08-28"]

  - id: ems_s1_20250828
    tier: same_sensor
    sensor: "Sentinel-1, 28 Aug 2025 01:07 UTC"
    date: "2025-08-28"
    dir: DEL_PRODUCT
    flood: EMSR838_AOI05_DEL_PRODUCT_observedEventA_v1
    analysis: EMSR838_AOI05_DEL_PRODUCT_areaOfInterestA_v1
    predictions: ["2025-08-28"]

  - id: ems_s1_20250901
    tier: same_sensor
    sensor: "Sentinel-1, 1 Sep 2025 13:12 UTC"
    date: "2025-09-01"
    dir: DEL_MONIT03
    flood: EMSR838_AOI05_DEL_MONIT03_observedEventA_v1
    analysis: EMSR838_AOI05_DEL_MONIT03_areaOfInterestA_v1
    predictions: ["2025-09-01"]

  - id: ems_s1_20250902
    tier: same_sensor
    sensor: "Sentinel-1, 2 Sep 2025 01:16 UTC"
    date: "2025-09-02"
    dir: DEL_MONIT04
    flood: EMSR838_AOI05_DEL_MONIT04_observedEventA_v1
    analysis: EMSR838_AOI05_DEL_MONIT04_areaOfInterestA_v1
    exclude: EMSR838_AOI05_DEL_MONIT04_imageFootprintA_v1
    exclude_where: {obj_type: "Not Analysed - No data"}
    predictions: ["2025-09-02"]
