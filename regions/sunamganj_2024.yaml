# SafeWindow region: the May-July 2024 flood in Sunamganj, Bangladesh.
# Same area and the same method as sunamganj_2022; only the dates differ. No
# threshold was changed for this year, so it is an unseen test of the method.

id: sunamganj_2024
name: "Sunamganj, Bangladesh: May-July 2024 flood"

area:
  admin_names: ["Sunamganj Sadar", "Chhatak", "Dowarabazar"]
  admin_unit: Upazila
  parent: Sunamganj
  parent_unit: District
  country: Bangladesh
  iso3: BGD
  bbox: [91.25, 24.80, 91.75, 25.18]

crs: "EPSG:32646"

dates:
  flood: ["2024-05-01", "2024-07-31"]          # 24 Sentinel-1 dates
  dry_reference: ["2024-02-01", "2024-03-31"]  # same season as 2022
  app: ["2024-05-01", "2024-07-31"]

rain_boxes:
  sunamganj: [90.95, 24.85, 91.75, 25.25]
  meghalaya_upstream: [91.30, 25.15, 92.10, 25.45]

rain_labels:
  sunamganj: {en: Sunamganj, bn: সুনামগঞ্জ}
  meghalaya_upstream: {en: "Meghalaya hills (upstream)", bn: "মেঘালয় পাহাড় (উজান)"}

settlements: osm
shelters_csv: null

supply_days: {default: 7, min: 2, max: 14}

languages: ["en", "bn"]
agencies: ["BMD", "FFWC", "DDM"]

references:
  unosat_event: FL20240502BGD
  benchmark: sunamganj_2024_benchmark.yaml

# Dated news reports. The report says the
# road "has been inundated" as of publication, so event_date is the publication date.
road_reports:
  - id: chhatak_dowarabazar_2024
    route: chhatak_dowarabazar
    event_date: "2024-06-18"
    published: "2024-06-18"
    source: "The Daily Observer (observerbd.com), 18 June 2024"
    url: "https://observerbd.com/news.php?id=477288"
    quote: "Several sections of major roads such as ... Chhatak-Dowarabazar have been inundated."

# Numbers shown on the evacuation card. Check each one with local partners before use.
emergency_contacts:
  - {name: "National Emergency Service", name_bn: "জাতীয় জরুরি সেবা", number: "999"}
